<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6efe3" />
  <meta name="description" content="Cerita Timun Mas - 10 halaman bergambar." />
  <title>Cerita Timun Mas</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- BACKSOUND -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music/backsound.mp3" type="audio/mpeg">
    Browser kamu tidak mendukung pemutar audio.
  </audio>

  <div class="app">

    <header class="app__bar">
      <div class="app__brand">
        <span class="app__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
            stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H18a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 18.5z"/>
            <path d="M8 3v18"/>
            <path d="M12 8h5"/>
            <path d="M12 12h5"/>
          </svg>
        </span>

        <h1 class="app__title">Cerita Timun Mas</h1>
      </div>

      <p class="app__counter" aria-live="polite">
        <span id="pageCurrent">1</span>
        <span class="app__counter-sep">/</span>
        10
      </p>
    </header>


    <main class="story" id="story" aria-live="polite">

      <figure class="story__figure">
        <img
          class="story__image"
          id="storyImage"
          src="img/1.jpg"
          alt="Halaman 1"
          draggable="false"
        />
      </figure>


      <div class="story__body">

        <span class="story__chapter" id="storyChapter">
          Adegan 1
        </span>

        <h2 class="story__heading" id="storyHeading">
          Doa Mbak Srini
        </h2>

        <p class="story__text" id="storyText"></p>


        <button
          class="read-btn"
          id="readBtn"
          type="button"
          aria-label="Bacakan cerita"
        >
          <span class="read-btn__icon">🔊</span>
          <span class="read-btn__text">Bacakan</span>
        </button>

      </div>

    </main>


    <footer class="nav">

      <button
        class="nav__btn nav__btn--prev"
        id="prevBtn"
        type="button"
      >
        <svg viewBox="0 0 24 24" width="20" height="20"
          fill="none" stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <path d="M15 5l-7 7 7 7"/>
        </svg>

        <span>Sebelumnya</span>
      </button>


      <div
        class="nav__dots"
        id="navDots"
        role="tablist"
        aria-label="Daftar halaman"
      ></div>


      <button
        class="nav__btn nav__btn--next"
        id="nextBtn"
        type="button"
      >
        <span>Berikutnya</span>

        <svg viewBox="0 0 24 24" width="20" height="20"
          fill="none" stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <path d="M9 5l7 7-7 7"/>
        </svg>
      </button>

    </footer>


    <div class="endnote" id="endnote" hidden>
      <p>
        Tamat. Terima kasih sudah membaca sampai halaman terakhir.
      </p>
    </div>

  </div>

  <script src="js/app.js"></script>

</body>
</html>
